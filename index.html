<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GymProgress</title>
    <!-- Telegram WebApp SDK, Tailwind CSS и Chart.js -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24 select-none">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="flex justify-between items-center mb-3">
        <div>
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">GymProgress</h1>
            <p id="total-tonnage-badge" class="text-xs text-emerald-400 font-bold">Тоннаж сессии: 0 кг</p>
        </div>
        <button id="end-workout-btn" type="button" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-xs px-3.5 py-2 rounded-xl font-black transition shadow-md shadow-rose-900/40">
            Завершить
        </button>
    </div>

    <!-- ВЫБОР ПРОГРАММЫ: ВЕРХ / НИЗ -->
    <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-2xl border border-slate-800 mb-4">
        <button id="split-upper-btn" type="button" onclick="setSplit('upper')" class="py-2.5 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md">
            ВЕРХ ТЕЛА
        </button>
        <button id="split-lower-btn" type="button" onclick="setSplit('lower')" class="py-2.5 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white">
            НИЗ ТЕЛА
        </button>
    </div>

    <!-- ВКЛАДКА 1: СЕССИЯ -->
    <div id="workout-tab" class="space-y-4">
        <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl">
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs text-slate-400 font-semibold tracking-wide">УПРАЖНЕНИЕ</label>
                <div class="flex gap-2">
                    <button type="button" onclick="openModal()" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold p-1">+ Новое</button>
                    <button type="button" onclick="deleteCurrentExercise()" class="text-xs text-rose-400 hover:text-rose-300 font-bold p-1">Удалить</button>
                </div>
            </div>

            <select id="exercise-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-white mb-2 outline-none focus:border-emerald-500"></select>

            <div id="prev-workout-hint" class="text-[11px] text-slate-400 mb-3 bg-slate-900/40 px-2.5 py-1.5 rounded-lg border border-slate-800/80">
                В прошлый раз: <span class="text-slate-300 italic">нет данных</span>
            </div>

            <div class="space-y-2 mb-4" id="sets-list"></div>

            <div class="border-t border-slate-700/60 pt-3">
                <div class="grid grid-cols-2 gap-3 mb-2">
                    <div>
                        <span class="block text-xs text-slate-400 mb-1 text-center font-semibold">Вес (кг)</span>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="adjustValue('input-weight', -2.5)" class="w-9 h-10 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold rounded-xl text-xs">-2.5</button>
                            <input type="number" id="input-weight" value="80" step="2.5" oninput="update1RMPrediction()" class="w-full bg-slate-900 border border-slate-700 rounded-xl h-10 text-center font-extrabold text-white outline-none focus:border-emerald-500">
                            <button type="button" onclick="adjustValue('input-weight', 2.5)" class="w-9 h-10 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold rounded-xl text-xs">+2.5</button>
                        </div>
                    </div>
                    <div>
                        <span class="block text-xs text-slate-400 mb-1 text-center font-semibold">Повторения</span>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="adjustValue('input-reps', -1)" class="w-9 h-10 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold rounded-xl text-xs">-1</button>
                            <input type="number" id="input-reps" value="8" step="1" oninput="update1RMPrediction()" class="w-full bg-slate-900 border border-slate-700 rounded-xl h-10 text-center font-extrabold text-white outline-none focus:border-emerald-500">
                            <button type="button" onclick="adjustValue('input-reps', 1)" class="w-9 h-10 bg-slate-700 hover:bg-slate-600 active:scale-95 text-white font-bold rounded-xl text-xs">+1</button>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-3">
                    <span id="predicted-1rm" class="text-[11px] text-cyan-400 font-semibold bg-cyan-950/40 px-2 py-0.5 rounded-full border border-cyan-800/40">
                        Расчетный 1ПМ: ~101 кг
                    </span>
                </div>

                <button id="add-set-btn" type="button" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    + Записать подход
                </button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ИСТОРИЯ ТРЕНИРОВОК -->
    <div id="history-tab" class="hidden space-y-3">
        <h3 class="text-sm font-bold text-slate-300 mb-2 px-1">Завершенные тренировки</h3>
        <div id="completed-workouts-list" class="space-y-3"></div>
    </div>

    <!-- ВКЛАДКА 3: ПРОГРЕСС -->
    <div id="progress-tab" class="hidden space-y-4">
        <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl">
            <h3 class="text-sm font-bold text-slate-300 mb-3">График рабочих весов</h3>
            <canvas id="progressChart" class="w-full h-48"></canvas>
        </div>

        <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Резервная копия данных</h4>
            <p class="text-xs text-slate-400 mb-3">Сохраните файл со всей историей подходов на случай сброса кэша.</p>
            <button type="button" onclick="downloadBackup()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition">
                💾 Скачать бэкап (JSON)
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ УПРАЖНЕНИЯ -->
    <div id="add-exercise-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-base font-black text-white">Добавить упражнение</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Название</label>
                <input type="text" id="new-ex-name" placeholder="Например: Тяга в наклоне" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Группа</label>
                <select id="new-ex-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
                    <option value="upper">Верх тела</option>
                    <option value="lower">Низ тела</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button type="button" onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2.5 rounded-xl">Отмена</button>
                <button type="button" onclick="saveNewExercise()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black py-2.5 rounded-xl">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-slate-800 backdrop-blur-md p-2.5 flex justify-around items-center max-w-md mx-auto">
        <button type="button" onclick="switchTab('workout')" id="nav-workout" class="flex flex-col items-center gap-1 text-emerald-400">
            <span class="text-lg">🏋️</span>
            <span class="text-[11px] font-bold">Сессия</span>
        </button>
        <button type="button" onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center gap-1 text-slate-500">
            <span class="text-lg">📋</span>
            <span class="text-[11px] font-bold">История</span>
        </button>
        <button type="button" onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center gap-1 text-slate-500">
            <span class="text-lg">📈</span>
            <span class="text-[11px] font-bold">Прогресс</span>
        </button>
    </div>

    <script>
        const BOT_TOKEN = "9061762719:AAE1Tb8eGHCnBMVVnOyuGYuYD31SkN0oQIk";
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const defaultExercises = [
            { id: '1', name: 'Жим штанги лежа', category: 'upper' },
            { id: '2', name: 'Подтягивания', category: 'upper' },
            { id: '3', name: 'Армейский жим', category: 'upper' },
            { id: '4', name: 'Брусья', category: 'upper' },
            { id: '5', name: 'Сгибания на бицепс', category: 'upper' },
            { id: '6', name: 'Приседания со штангой', category: 'lower' },
            { id: '7', name: 'Становая тяга', category: 'lower' },
            { id: '8', name: 'Выпады с гантелями', category: 'lower' },
            { id: '9', name: 'Подъем на носки (икры)', category: 'lower' }
        ];

        let currentSplit = localStorage.getItem('currentSplit') || 'upper';
        let exercises = JSON.parse(localStorage.getItem('exercisesList')) || defaultExercises;
        let workoutData = JSON.parse(localStorage.getItem('workoutData')) || [];
        let completedWorkouts = JSON.parse(localStorage.getItem('completedWorkouts')) || [];

        const exSelect = document.getElementById('exercise-select');
        const setsList = document.getElementById('sets-list');

        function calc1RM(weight, reps) {
            if (reps <= 1) return weight;
            return Math.round(weight * (1 + reps / 30) * 10) / 10;
        }

        function update1RMPrediction() {
            const w = parseFloat(document.getElementById('input-weight').value) || 0;
            const r = parseInt(document.getElementById('input-reps').value) || 0;
            const rm = calc1RM(w, r);
            document.getElementById('predicted-1rm').innerText = `Расчетный 1ПМ: ~${rm} кг`;
        }

        window.adjustValue = function(elementId, delta) {
            const el = document.getElementById(elementId);
            let val = (parseFloat(el.value) || 0) + delta;
            if (elementId === 'input-reps') val = Math.max(1, Math.round(val));
            else val = Math.max(0, Math.round(val * 10) / 10);
            el.value = val;
            update1RMPrediction();
        };

        function setSplit(split) {
            currentSplit = split;
            localStorage.setItem('currentSplit', split);

            const btnUpper = document.getElementById('split-upper-btn');
            const btnLower = document.getElementById('split-lower-btn');

            if (split === 'upper') {
                btnUpper.className = "py-2.5 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md";
                btnLower.className = "py-2.5 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white";
            } else {
                btnLower.className = "py-2.5 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md";
                btnUpper.className = "py-2.5 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white";
            }
            renderExercises();
        }

        function renderExercises() {
            const filtered = exercises.filter(e => e.category === currentSplit);
            exSelect.innerHTML = '';

            if (filtered.length === 0) {
                exSelect.innerHTML = '<option disabled>Список пуст</option>';
            } else {
                filtered.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.name;
                    opt.innerText = ex.name;
                    exSelect.appendChild(opt);
                });
            }
            onExerciseChanged();
        }

        function onExerciseChanged() {
            const currentEx = exSelect.value;
            const history = workoutData.filter(s => s.exercise === currentEx);

            const hintEl = document.getElementById('prev-workout-hint');
            if (history.length > 0) {
                const lastSets = history.slice(-3);
                hintEl.innerHTML = `В прошлый раз: <span class="text-emerald-300 font-semibold">${lastSets.map(s => `${s.weight}×${s.reps}`).join(', ')}</span>`;
                const last = history[history.length - 1];
                document.getElementById('input-weight').value = last.weight;
                document.getElementById('input-reps').value = last.reps;
            } else {
                hintEl.innerHTML = `В прошлый раз: <span class="text-slate-400 italic">нет записей</span>`;
            }

            update1RMPrediction();
            renderSets();
            updateTotalTonnage();
        }

        function updateTotalTonnage() {
            const today = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            const todaySets = workoutData.filter(s => s.date === today);
            const total = todaySets.reduce((sum, s) => sum + (s.weight * s.reps), 0);
            document.getElementById('total-tonnage-badge').innerText = `Тоннаж сессии: ${Math.round(total)} кг`;
        }

        function renderSets() {
            setsList.innerHTML = '';
            const currentEx = exSelect.value;
            const currentSets = workoutData.filter(s => s.exercise === currentEx);

            if (currentSets.length === 0) {
                setsList.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">Подходов пока нет</p>';
                return;
            }

            currentSets.forEach((set, idx) => {
                const prBadge = set.isPR ? `<span class="text-xs mr-1" title="Личный рекорд">🏆</span>` : '';
                setsList.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900/60 px-3 py-2 rounded-xl border border-slate-800 text-xs">
                        <span class="text-slate-400 font-bold">Подход ${idx + 1}</span>
                        <div class="flex items-center gap-2">
                            ${prBadge}
                            <span class="font-extrabold text-white text-sm">${set.weight} кг × ${set.reps}</span>
                            <span class="text-[10px] text-cyan-400 font-semibold">(${calc1RM(set.weight, set.reps)} 1ПМ)</span>
                            <button type="button" onclick="deleteSet('${set.id}')" class="w-7 h-7 ml-1 flex items-center justify-center bg-rose-500/10 active:bg-rose-500/30 text-rose-400 rounded-lg text-xs font-black transition">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('add-set-btn').addEventListener('click', () => {
            const weight = parseFloat(document.getElementById('input-weight').value);
            const reps = parseInt(document.getElementById('input-reps').value);
            const currentEx = exSelect.value;

            if (!weight || !reps || !currentEx) return;

            const new1RM = calc1RM(weight, reps);
            const prevSets = workoutData.filter(s => s.exercise === currentEx);
            const maxPrev1RM = prevSets.reduce((max, s) => Math.max(max, calc1RM(s.weight, s.reps)), 0);
            const isPR = prevSets.length > 0 && new1RM > maxPrev1RM;

            workoutData.push({
                id: 'set_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                exercise: currentEx,
                split: currentSplit,
                weight: weight,
                reps: reps,
                isPR: isPR,
                date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
            });

            localStorage.setItem('workoutData', JSON.stringify(workoutData));
            renderSets();
            updateTotalTonnage();

            if (isPR && tg.showPopup) {
                tg.showPopup({ title: '🔥 Новый рекорд!', message: `Ты побил свой 1ПМ в упражнении "${currentEx}" — теперь ${new1RM} кг!` });
            }
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(isPR ? 'heavy' : 'medium');
        });

        window.deleteSet = function(setId) {
            workoutData = workoutData.filter(s => s.id !== setId);
            localStorage.setItem('workoutData', JSON.stringify(workoutData));
            renderSets();
            updateTotalTonnage();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        };

        window.openModal = function() {
            document.getElementById('new-ex-category').value = currentSplit;
            document.getElementById('add-exercise-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('new-ex-name').value = '';
            document.getElementById('add-exercise-modal').classList.add('hidden');
        };

        window.saveNewExercise = function() {
            const name = document.getElementById('new-ex-name').value.trim();
            const category = document.getElementById('new-ex-category').value;
            if (!name) return;

            exercises.push({ id: Date.now().toString(), name: name, category: category });
            localStorage.setItem('exercisesList', JSON.stringify(exercises));
            closeModal();
            setSplit(category);
            exSelect.value = name;
            onExerciseChanged();
        };

        window.deleteCurrentExercise = function() {
            const currentEx = exSelect.value;
            if (!currentEx) return;
            if (confirm(`Удалить упражнение "${currentEx}"?`)) {
                exercises = exercises.filter(e => e.name !== currentEx);
                localStorage.setItem('exercisesList', JSON.stringify(exercises));
                renderExercises();
            }
        };

        exSelect.addEventListener('change', onExerciseChanged);

        function renderHistoryList() {
            const container = document.getElementById('completed-workouts-list');
            container.innerHTML = '';

            if (completedWorkouts.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/40 p-6 rounded-2xl text-center">
                        <p class="text-xs text-slate-400">Пока нет завершенных тренировок.<br>Нажмите «Завершить» во время тренировки, чтобы сохранить её сюда.</p>
                    </div>
                `;
                return;
            }

            completedWorkouts.slice().reverse().forEach(w => {
                let exercisesHTML = '';
                for (const [ex, sList] of Object.entries(w.groupedSets || {})) {
                    const setsStr = sList.map(s => `${s.weight}×${s.reps}${s.isPR ? ' 🏆' : ''}`).join(', ');
                    exercisesHTML += `<p class="text-xs text-slate-300">• <span class="font-bold text-white">${ex}:</span> ${setsStr}</p>`;
                }

                container.innerHTML += `
                    <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl space-y-2">
                        <div class="flex justify-between items-center border-b border-slate-700/40 pb-2">
                            <div>
                                <span class="text-sm font-black text-emerald-400">${w.split}</span>
                                <span class="text-[11px] text-slate-400 block">${w.date} в ${w.time}</span>
                            </div>
                            <span class="text-xs font-extrabold text-cyan-400 bg-cyan-950/40 px-2 py-1 rounded-lg border border-cyan-800/30">${w.tonnage} кг</span>
                        </div>
                        <div class="space-y-1 pt-1">${exercisesHTML}</div>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            const workout = document.getElementById('workout-tab');
            const history = document.getElementById('history-tab');
            const progress = document.getElementById('progress-tab');
            const navW = document.getElementById('nav-workout');
            const navH = document.getElementById('nav-history');
            const navP = document.getElementById('nav-progress');

            workout.classList.add('hidden');
            history.classList.add('hidden');
            progress.classList.add('hidden');

            navW.className = "flex flex-col items-center gap-1 text-slate-500";
            navH.className = "flex flex-col items-center gap-1 text-slate-500";
            navP.className = "flex flex-col items-center gap-1 text-slate-500";

            if (tab === 'workout') {
                workout.classList.remove('hidden');
                navW.className = "flex flex-col items-center gap-1 text-emerald-400";
            } else if (tab === 'history') {
                history.classList.remove('hidden');
                navH.className = "flex flex-col items-center gap-1 text-emerald-400";
                renderHistoryList();
            } else {
                progress.classList.remove('hidden');
                navP.className = "flex flex-col items-center gap-1 text-emerald-400";
                drawChart();
            }
        }

        let chart = null;
        function drawChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const currentEx = exSelect.value;
            const data = workoutData.filter(s => s.exercise === currentEx);

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: `${currentEx} (кг)`,
                        data: data.map(d => d.weight),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { grid: { color: '#334155' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        window.downloadBackup = function() {
            const backupPayload = {
                exercises: exercises,
                sets: workoutData,
                completedWorkouts: completedWorkouts
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `gym_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        };

        // Завершение тренировки с детальным отчётом
        document.getElementById('end-workout-btn').addEventListener('click', async () => {
            const today = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
            const todaySets = workoutData.filter(s => s.date === today);

            if (todaySets.length === 0) {
                alert("Сегодня еще не записано ни одного подхода.");
                return;
            }

            if (!confirm("Завершить тренировку и отправить отчет?")) return;

            const splitName = currentSplit === 'upper' ? 'Верх тела' : 'Низ тела';
            const totalTonnage = Math.round(todaySets.reduce((sum, s) => sum + (s.weight * s.reps), 0));
            const totalReps = todaySets.reduce((sum, s) => sum + s.reps, 0);
            const avgWeight = totalReps > 0 ? (totalTonnage / totalReps).toFixed(1) : 0;

            // Сравнение тоннажа с предыдущей сессией такого же сплита
            const prevWorkout = completedWorkouts.slice().reverse().find(w => w.split === splitName);
            let tonnageDiffStr = '';
            if (prevWorkout) {
                const diff = totalTonnage - prevWorkout.tonnage;
                if (diff > 0) {
                    tonnageDiffStr = ` (+${diff.toLocaleString('ru-RU')} кг к прошлой сессии ↗️)`;
                } else if (diff < 0) {
                    tonnageDiffStr = ` (${diff.toLocaleString('ru-RU')} кг к прошлой сессии ↘️)`;
                } else {
                    tonnageDiffStr = ` (= к прошлой сессии)`;
                }
            }

            // Группировка подходов по упражнениям
            const grouped = {};
            todaySets.forEach(s => {
                grouped[s.exercise] = grouped[s.exercise] || [];
                grouped[s.exercise].push(s);
            });

            // Подсчет упражнений с новыми рекордами (PR)
            const prExercises = [...new Set(todaySets.filter(s => s.isPR).map(s => s.exercise))];
            const prSummary = prExercises.length > 0 
                ? `${prExercises.length} (${prExercises.join(', ')}) 🏆` 
                : '0';

            // Сборка сообщения
            let message = `🏁 *ТРЕНИРОВКА: ${splitName}*\n📅 _${new Date().toLocaleDateString('ru-RU')}_\n\n📋 *УПРАЖНЕНИЯ:*\n`;

            for (const [ex, sets] of Object.entries(grouped)) {
                const exTonnage = Math.round(sets.reduce((sum, s) => sum + (s.weight * s.reps), 0));
                const setsStr = sets.map(s => `${s.weight}×${s.reps}${s.isPR ? ' 🏆' : ''}`).join(', ');

                // Определение топ-сета (подхода с наибольшим расчетным 1ПМ)
                let topSet = sets[0];
                let topSet1RM = calc1RM(topSet.weight, topSet.reps);
                sets.forEach(s => {
                    const current1RM = calc1RM(s.weight, s.reps);
                    if (current1RM > topSet1RM) {
                        topSet = s;
                        topSet1RM = current1RM;
                    }
                });

                message += `• *${ex}*\n`;
                message += `  ├ ${setsStr}\n`;
                message += `  ├ ⭐ Топ-сет: ${topSet.weight} кг × ${topSet.reps} (1ПМ ~${topSet1RM} кг)\n`;
                message += `  └ Тоннаж: ${exTonnage.toLocaleString('ru-RU')} кг\n\n`;
            }

            message += `────────────────────\n📊 *ИТОГИ СЕССИИ:*\n`;
            message += `• Общий тоннаж: ${totalTonnage.toLocaleString('ru-RU')} кг${tonnageDiffStr}\n`;
            message += `• Подходов: ${todaySets.length}  |  Повторений: ${totalReps}\n`;
            message += `• Средний рабочий вес: ${avgWeight} кг\n`;
            message += `• 🏆 Новые рекорды: ${prSummary}`;

            // Сохранение в локальную историю внутри телефона
            completedWorkouts.push({
                id: Date.now(),
                date: new Date().toLocaleDateString('ru-RU'),
                time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                split: splitName,
                tonnage: totalTonnage,
                setsCount: todaySets.length,
                totalReps: totalReps,
                groupedSets: grouped
            });
            localStorage.setItem('completedWorkouts', JSON.stringify(completedWorkouts));

            // Отправка в диалог Telegram
            const userId = tg.initDataUnsafe?.user?.id;
            if (userId) {
                try {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (err) {
                    console.error("Ошибка отправки отчета:", err);
                }
            }

            tg.close();
        });

        setSplit(currentSplit);
    </script>
</body>
</html>
