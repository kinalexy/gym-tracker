<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GymProgress</title>
    <!-- Telegram WebApp SDK, Tailwind CSS и Chart.js -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24 select-none">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">GymProgress</h1>
            <p class="text-xs text-slate-400">Фиксация прогресса</p>
        </div>
        <button id="end-workout-btn" class="bg-rose-600/80 hover:bg-rose-600 active:scale-95 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition">Завершить</button>
    </div>

    <!-- ВЫБОР ДНЯ: ВЕРХ / НИЗ ТЕЛА -->
    <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-2xl border border-slate-800 mb-4">
        <button id="split-upper-btn" onclick="setSplit('upper')" class="py-2 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md">
            ВЕРХ ТЕЛА
        </button>
        <button id="split-lower-btn" onclick="setSplit('lower')" class="py-2 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white">
            НИЗ ТЕЛА
        </button>
    </div>

    <!-- ВКЛАДКА: ТРЕНИРОВКА -->
    <div id="workout-tab" class="space-y-4">
        <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl">
            <!-- Управление упражнением -->
            <div class="flex justify-between items-center mb-1">
                <label class="block text-xs text-slate-400 font-semibold">УПРАЖНЕНИЕ</label>
                <div class="flex gap-2">
                    <button onclick="openModal()" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold">+ Новое</button>
                    <button onclick="deleteCurrentExercise()" class="text-xs text-rose-400 hover:text-rose-300 font-bold">Удалить</button>
                </div>
            </div>

            <!-- Селектор упражнения -->
            <select id="exercise-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-white mb-4 outline-none focus:border-emerald-500">
                <!-- Опции генерируются динамически под выбранный сплит -->
            </select>

            <!-- Список подходов -->
            <div class="space-y-2 mb-4" id="sets-list">
                <!-- Подходы с кнопкой удаления ✕ выводятся здесь -->
            </div>

            <!-- Форма добавления подхода -->
            <div class="border-t border-slate-700/60 pt-3">
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <span class="block text-xs text-slate-400 mb-1">Вес (кг)</span>
                        <input type="number" id="input-weight" value="80" step="2.5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-center font-bold text-white outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <span class="block text-xs text-slate-400 mb-1">Повторения</span>
                        <input type="number" id="input-reps" value="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-center font-bold text-white outline-none focus:border-emerald-500">
                    </div>
                </div>
                <button id="add-set-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-black py-3 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    + Записать подход
                </button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА: ПРОГРЕСС -->
    <div id="progress-tab" class="hidden space-y-4">
        <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-2xl">
            <h3 class="text-sm font-bold text-slate-300 mb-3">График рабочих весов</h3>
            <canvas id="progressChart" class="w-full h-48"></canvas>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ УПРАЖНЕНИЯ -->
    <div id="add-exercise-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-base font-black text-white">Добавить упражнение</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Название</label>
                <input type="text" id="new-ex-name" placeholder="Например: Тяга штанги в наклоне" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Группа</label>
                <select id="new-ex-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white outline-none focus:border-emerald-500">
                    <option value="upper">Верх тела</option>
                    <option value="lower">Низ тела</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2.5 rounded-xl">Отмена</button>
                <button onclick="saveNewExercise()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black py-2.5 rounded-xl">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-slate-800 backdrop-blur-md p-2.5 flex justify-around items-center max-w-md mx-auto">
        <button onclick="switchTab('workout')" id="nav-workout" class="flex flex-col items-center gap-1 text-emerald-400">
            <span class="text-lg">🏋️</span>
            <span class="text-[11px] font-bold">Сессия</span>
        </button>
        <button onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center gap-1 text-slate-500">
            <span class="text-lg">📈</span>
            <span class="text-[11px] font-bold">Прогресс</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Базовый список упражнений с делением на верх и низ
        const defaultExercises = [
            { id: '1', name: 'Жим штанги лежа', category: 'upper' },
            { id: '2', name: 'Подтягивания', category: 'upper' },
            { id: '3', name: 'Армейский жим', category: 'upper' },
            { id: '4', name: 'Брусья', category: 'upper' },
            { id: '5', name: 'Сгибания на бицепс', category: 'upper' },
            { id: '6', name: 'Приседания со штангой', category: 'lower' },
            { id: '7', name: 'Становая тяга', category: 'lower' },
            { id: '8', name: 'Выпады с гантелями', category: 'lower' },
            { id: '9', name: 'Подъем на носки (икры)', category: 'lower' }
        ];

        let currentSplit = localStorage.getItem('currentSplit') || 'upper';
        let exercises = JSON.parse(localStorage.getItem('exercisesList')) || defaultExercises;
        let workoutData = JSON.parse(localStorage.getItem('workoutData')) || [];

        const exSelect = document.getElementById('exercise-select');
        const setsList = document.getElementById('sets-list');

        function setSplit(split) {
            currentSplit = split;
            localStorage.setItem('currentSplit', split);

            const btnUpper = document.getElementById('split-upper-btn');
            const btnLower = document.getElementById('split-lower-btn');

            if (split === 'upper') {
                btnUpper.className = "py-2 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md";
                btnLower.className = "py-2 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white";
            } else {
                btnLower.className = "py-2 text-xs font-black rounded-xl transition bg-emerald-500 text-slate-950 shadow-md";
                btnUpper.className = "py-2 text-xs font-bold text-slate-400 rounded-xl transition hover:text-white";
            }

            renderExercises();
        }

        function renderExercises() {
            const filtered = exercises.filter(e => e.category === currentSplit);
            exSelect.innerHTML = '';

            if (filtered.length === 0) {
                exSelect.innerHTML = '<option disabled>Список пуст</option>';
            } else {
                filtered.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.name;
                    opt.innerText = ex.name;
                    exSelect.appendChild(opt);
                });
            }
            renderSets();
        }

        function renderSets() {
            setsList.innerHTML = '';
            const currentEx = exSelect.value;
            const currentSets = workoutData.filter(s => s.exercise === currentEx);

            if (currentSets.length === 0) {
                setsList.innerHTML = '<p class="text-xs text-slate-500 text-center py-2">Подходов пока нет</p>';
                return;
            }

            currentSets.forEach((set, idx) => {
                setsList.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900/50 px-3 py-2 rounded-xl border border-slate-800/80 text-xs">
                        <span class="text-slate-400 font-bold">Подход ${idx + 1}</span>
                        <div class="flex items-center gap-3">
                            <span class="font-extrabold text-white">${set.weight} кг × ${set.reps} повт.</span>
                            <button onclick="deleteSet('${set.id}')" class="text-rose-400 hover:text-rose-300 active:scale-90 font-bold p-1">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        // Запись нового подхода
        document.getElementById('add-set-btn').addEventListener('click', () => {
            const weight = parseFloat(document.getElementById('input-weight').value);
            const reps = parseInt(document.getElementById('input-reps').value);

            if (!weight || !reps || !exSelect.value) return;

            workoutData.push({
                id: Date.now().toString(),
                exercise: exSelect.value,
                weight: weight,
                reps: reps,
                date: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })
            });

            localStorage.setItem('workoutData', JSON.stringify(workoutData));
            renderSets();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        });

        // Удаление конкретного подхода по ID
        window.deleteSet = function(setId) {
            workoutData = workoutData.filter(s => s.id !== setId);
            localStorage.setItem('workoutData', JSON.stringify(workoutData));
            renderSets();
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        };

        // Добавление нового упражнения
        window.openModal = function() {
            document.getElementById('new-ex-category').value = currentSplit;
            document.getElementById('add-exercise-modal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('new-ex-name').value = '';
            document.getElementById('add-exercise-modal').classList.add('hidden');
        };

        window.saveNewExercise = function() {
            const name = document.getElementById('new-ex-name').value.trim();
            const category = document.getElementById('new-ex-category').value;

            if (!name) return;

            exercises.push({
                id: Date.now().toString(),
                name: name,
                category: category
            });

            localStorage.setItem('exercisesList', JSON.stringify(exercises));
            closeModal();
            setSplit(category);
            exSelect.value = name;
            renderSets();
        };

        // Удаление текущего выбранного упражнения
        window.deleteCurrentExercise = function() {
            const currentEx = exSelect.value;
            if (!currentEx) return;

            if (confirm(`Удалить упражнение "${currentEx}" из списка?`)) {
                exercises = exercises.filter(e => e.name !== currentEx);
                localStorage.setItem('exercisesList', JSON.stringify(exercises));
                renderExercises();
            }
        };

        exSelect.addEventListener('change', renderSets);

        // Переключение табов
        function switchTab(tab) {
            const workout = document.getElementById('workout-tab');
            const progress = document.getElementById('progress-tab');
            const navW = document.getElementById('nav-workout');
            const navP = document.getElementById('nav-progress');

            if (tab === 'workout') {
                workout.classList.remove('hidden');
                progress.classList.add('hidden');
                navW.className = "flex flex-col items-center gap-1 text-emerald-400";
                navP.className = "flex flex-col items-center gap-1 text-slate-500";
            } else {
                workout.classList.add('hidden');
                progress.classList.remove('hidden');
                navP.className = "flex flex-col items-center gap-1 text-emerald-400";
                navW.className = "flex flex-col items-center gap-1 text-slate-500";
                drawChart();
            }
        }

        let chart = null;
        function drawChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const currentEx = exSelect.value;
            const data = workoutData.filter(s => s.exercise === currentEx);

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: `${currentEx} (кг)`,
                        data: data.map(d => d.weight),
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { grid: { color: '#334155' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        document.getElementById('end-workout-btn').addEventListener('click', () => {
            if (confirm("Завершить тренировку?")) {
                if (tg.sendData) {
                    tg.sendData(JSON.stringify(workoutData));
                }
                tg.close();
            }
        });

        // Инициализация при старте
        setSplit(currentSplit);
    </script>
</body>
</html>
